[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video2prompt"
version = "0.1.0"
description = "Transforme une vidéo en prompts réutilisables pour les générateurs vidéo IA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
transcribe = ["faster-whisper>=1.2"]
download = ["yt-dlp"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
all = [
    "anthropic>=1.0",
    "faster-whisper>=1.2",
    "yt-dlp",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
video2prompt = "video2prompt.cli:main"
video2prompt-web = "video2prompt.web.app:main"

[tool.setuptools]
packages = ["video2prompt", "video2prompt.web"]

[tool.setuptools.package-data]
"video2prompt.web" = ["static/*"]
